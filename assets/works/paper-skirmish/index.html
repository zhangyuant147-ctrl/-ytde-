      if(count+placed>=limit){if(!stroke.warned)notify('已达到'+(unit?'棋子':'地形')+'上限（'+limit+'）。可先擦除一些。');stroke.warned=true;break;}
      const x=clamp(pos.x+ox+(offsets.length>1?(Math.random()-.5)*5:0),11,989),y=clamp(pos.y+oy,13,439);
      const collision=(unit?sim.units:sim.props).some(p=>Math.hypot(p.x-x,p.y-y)<(unit?7:12));
      if(collision)continue;
      const p=definition(kind,x,y);if(setup)layout.push(p);sim.add(p);placed++;stroke.changed=true;
    }
  }
  dirty=true;updateHud();
}
function endStroke(){
  if(!stroke)return;
  const ended=stroke;stroke=null;
  if(ended.pointer!==undefined&&canvas.hasPointerCapture(ended.pointer))canvas.releasePointerCapture(ended.pointer);
  if(ended.changed&&ended.before&&phase==='setup'){
    remember(ended.before);scene='custom';save();
    if(mode==='free'&&getReady()&&!ended.hadOpponents&&!ended.erase)startBattle();
  }
  if(ended.touch)hover=null;dirty=true;updateHud();
}
function beginStroke(pos,erase,pointer,touch){
  if(stroke||phase==='finished')return false;
  stroke={erase,last:pos,carry:0,changed:false,before:phase==='setup'?snapshot():null,hadOpponents:getReady(),pointer,touch};
  hover=pos;dab(pos);return true;
}
function continueStroke(pos){
  const s=stroke;if(!s)return;
  const dx=pos.x-s.last.x,dy=pos.y-s.last.y,len=Math.hypot(dx,dy);
  if(!len)return;
  const step=s.erase?eraserRadius()*.45:brushSpacing();
  for(let along=step-s.carry;along<=len;along+=step)dab({x:s.last.x+dx*along/len,y:s.last.y+dy*along/len});
  s.carry=(s.carry+len)%step;s.last=pos;hover=pos;dirty=true;
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  if(![0,2].includes(e.button)||stroke||phase==='finished')return;
  e.preventDefault();isKeyboard=false;canvas.focus({preventScroll:true});
  const p=point(e);marker={...p};
  if(inspecting&&e.button===0){pickUnit(p);return;}
  if(beginStroke(p,erasing||e.button===2,e.pointerId,e.pointerType==='touch'))canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(stroke&&stroke.pointer!==e.pointerId)return;
  isKeyboard=false;
  if(stroke){for(const ev of e.getCoalescedEvents?.()||[])continueStroke(point(ev));continueStroke(point(e));}
  else if(e.pointerType!=='touch'){hover=point(e);dirty=true;}
});
canvas.addEventListener('pointerup',e=>{if(stroke?.pointer===e.pointerId){continueStroke(point(e));endStroke();}});
canvas.addEventListener('pointercancel',e=>{if(stroke?.pointer===e.pointerId)endStroke();});
canvas.addEventListener('lostpointercapture',e=>{if(stroke?.pointer===e.pointerId)endStroke();});
canvas.addEventListener('pointerleave',()=>{if(!stroke){hover=null;dirty=true;}});
canvas.addEventListener('blur',()=>{if(isKeyboard){isKeyboard=false;hover=null;dirty=true;}});
let lastWheel=0;
canvas.addEventListener('wheel',e=>{
  if(e.ctrlKey||!e.deltaY)return;
  e.preventDefault();const now=performance.now();if(now-lastWheel<120)return;lastWheel=now;
  setSize(size+(e.deltaY<0?1:-1));hover=point(e);notify('笔刷 · '+brushNames[size-1]);
},{passive:false});
document.addEventListener('keydown',e=>{
  if(modal.open||e.target.matches('select,input,textarea'))return;
  const k=e.key.toLowerCase(),drawing=e.target===canvas;
  if((e.ctrlKey||e.metaKey)&&k==='z'&&!e.shiftKey){e.preventDefault();if(!e.repeat)undo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(drawing&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Delete','Backspace'].includes(e.key)){
    e.preventDefault();isKeyboard=true;
    const step=e.shiftKey?45:16;
    if(e.key.startsWith('Arrow')){marker.x=clamp(marker.x+({ArrowLeft:-step,ArrowRight:step}[e.key]||0),12,988);marker.y=clamp(marker.y+({ArrowUp:-step,ArrowDown:step}[e.key]||0),13,437);}
    else if(!e.repeat){if(inspecting&&e.key==='Enter')pickUnit(marker);else{beginStroke(marker,e.key!=='Enter'||erasing);endStroke();}}
    hover={...marker};dirty=true;return;
  }
  if(e.repeat)return;
  if(k===' '&&(!e.target.closest('button,a')||drawing||e.target.closest('[data-kind],[data-group]'))){e.preventDefault();togglePlay();}
  else if(k==='i')toggleInspect();else if(k==='m')$('audio').click();else if(k==='c')clearBoard();else if(k==='e')toggleErase();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.kind){setBrush(b.dataset.kind);return;}
  if(b.dataset.group){const id=b.dataset.group;setBrush(Object.keys(ALL).find(k=>(TYPES[k]?.group||'terrain')===id));return;}
  if(b.dataset.preset){usePreset(b.dataset.preset);return;}
  switch(b.id){
    case 'inspect':case 'closeWatch':toggleInspect();break;
    case 'lab':openLab();break;case 'duelStart':duel();break;
    case 'report':openReport();break;
    case 'scene':scenes();break;case 'help':showHelp();break;case 'closeModal':modal.close();break;
    case 'play':case 'rematch':togglePlay();break;
    case 'return':case 'editResult':resetSim();notify('已恢复开战前的阵型。');break;
    case 'audio':audioOn=!audioOn;sound('start',true);save();updateHud();break;
    case 'speed':speed=speed===1?2:speed===2?.5:1;updateHud();break;
    case 'erase':toggleErase();break;case 'undo':undo();break;case 'clear':clearBoard();break;
  }
});
$('size').addEventListener('input',()=>setSize($('size').value));
$('mode').addEventListener('change',()=>setMode($('mode').value));
document.addEventListener('visibilitychange',()=>{
  endStroke();
  if(document.hidden){cancelAnimationFrame(frameId);frameId=0;last=0;
    if(phase==='playing'){phase='paused';updateHud();dirty=true;}}
  else if(!frameId){last=0;frameId=requestAnimationFrame(tick);}
});
new ResizeObserver(resize).observe($('field'));
tabs();brushes();setSize(size);updateHud();resize();frameId=requestAnimationFrame(tick);
</script></body></html>
